<!-- You can freely remove the <app-sample-card> and create your 
    own components for displaying weather data. -->

<div class="home-container">
    <div class="search-container">
        <app-weather-search (weatherFound)="onWeatherFound($event)"></app-weather-search>
    </div>
    <div class="card-container">
        <ng-container *ngIf="weatherData; else placeholder">
            <app-weather-card [weatherData]="weatherData" [unit]="unit"></app-weather-card>
            <app-weather-details-card [weatherData]="weatherData" [unit]="unit"></app-weather-details-card>
        </ng-container>

        <ng-template #placeholder>
            <div class="weather-placeholder weather-card">
                <p>Search for a city to see weather data</p>
            </div>
            <div class="weather-details-placeholder weather-card">
                <p>Weather details will appear here</p>
            </div>
        </ng-template>
    </div>
</div>
