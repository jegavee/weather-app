<div class="home-container">
  <div class="search-container">
    <app-weather-search (searchCity)="onSearch($event)"></app-weather-search>
  </div>

  <div class="card-container">

    <!-- Idle / Default State -->
    <ng-container *ngIf="!city()">
      <div class="weather-placeholder weather-card">
        <p>Search for a city to see weather data</p>
      </div>
      <div class="weather-details-placeholder weather-card">
        <p>Weather details will appear here</p>
      </div>
    </ng-container>

    <!-- When a city is set, handle the resource states -->
    <ng-container *ngIf="city()">

      <!-- Loading State -->
      <ng-container *ngIf="weatherData.isLoading()">
        <div class="loading-container weather-card">
          <div class="loading-spinner"></div>
          <p>Loading weather data...</p>
        </div>
        <div class="loading-container weather-card">
          <div class="loading-spinner"></div>
          <p>Loading weather details...</p>
        </div>
      </ng-container>

      <!-- Error State - Show actual error message and prevent overlap with other states -->
      <ng-container *ngIf="weatherData.error() && !weatherData.isLoading()">
        <div class="error-container weather-card">
          <p class="error-icon">⚠️</p>
          <p class="error-message">{{ weatherData.error()?.message || 'Failed to fetch weather data' }}</p>
        </div>
        <div class="error-placeholder weather-card">
          <p>Weather details unavailable</p>
        </div>
      </ng-container>

      <!-- Success State - Use hasValue() and prevent overlap with loading/error states -->
      <ng-container *ngIf="weatherData.hasValue() && !weatherData.isLoading() && !weatherData.error()">
        <app-weather-card [weatherData]="weatherData.value()" [unit]="unit()"></app-weather-card>
        <app-weather-details-card [weatherData]="weatherData.value()" [unit]="unit()"></app-weather-details-card>
      </ng-container>

    </ng-container>
  </div>
</div>
