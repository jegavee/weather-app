<div class="font-sans w-full h-dvh flex flex-col items-center justify-between box-border p-4 m-0 flex-1 md:w-sm">
  <div class="w-full mb-4 items-center flex-shrink-0 z-10 p-0 m-0">
    <app-weather-search (searchCity)="onSearch($event)"></app-weather-search>
  </div>

  <div class="flex flex-col gap-2 flex-1 items-center m-0 p-0 md:w-sm">

    <!-- Idle / Default State -->
    <ng-container *ngIf="!city()">
      <div class="flex justify-center text-white text-xl mt-8 min-h-[195px] w-screen -mx-4 px-4 text-center items-center">
        <p>Search for a city to see weather data</p>
      </div>
      <div class="flex justify-center items-center bg-white text-black text-base mt-8 rounded-3xl flex-1 w-full text-center items-center">
        <p>Weather details will appear here</p>
      </div>
    </ng-container>

    <!-- When a city is set, handle the resource states -->
    <ng-container *ngIf="city()">

      <!-- Loading State -->
      <ng-container *ngIf="weatherData.isLoading()">
        <div class="flex flex-col items-center justify-center gap-4 p-8 text-center min-h-[150px] bg-white rounded-3xl text-center items-center">
          <div class="w-10 h-10 border-4 border-gray-200 border-t-blue-500 rounded-full animate-spin"></div>
          <p>Loading weather data...</p>
        </div>
        <div class="flex flex-col items-center justify-center gap-4 p-8 text-center min-h-[150px] bg-white rounded-3xl text-center items-center">
          <div class="w-10 h-10 border-4 border-gray-200 border-t-blue-500 rounded-full animate-spin"></div>
          <p>Loading weather details...</p>
        </div>
      </ng-container>

      <!-- Error State - Show actual error message and prevent overlap with other states -->
      <ng-container *ngIf="weatherData.error() && !weatherData.isLoading()">
        <div class="flex flex-col items-center justify-center mt-8 min-h-[200px] w-screen -mx-4 px-4 text-center items-center">
          <p class="text-5xl m-0">⚠️</p>
          <p class="text-white text-xl m-0">{{ weatherData.error()?.message || 'Failed to fetch weather data' }}</p>
        </div>
        <div class="flex justify-center items-center bg-white text-black text-base mt-8 rounded-3xl flex-1 w-full text-center items-center">
          <p>Weather details unavailable</p>
        </div>
      </ng-container>

      <!-- Success State - Use hasValue() and prevent overlap with loading/error states -->
      <ng-container *ngIf="weatherData.hasValue() && !weatherData.isLoading() && !weatherData.error()">
        <app-weather-card [weatherData]="weatherData.value()" [unit]="unit()"></app-weather-card>
        <app-weather-details-card [weatherData]="weatherData.value()" [unit]="unit()"></app-weather-details-card>
      </ng-container>

    </ng-container>
  </div>
</div>
