<div class="p-6 max-w-full gap-4 text-center" *ngIf="weatherData() as data">
  <div class="items-center text-white mb-2">
    <h2 class="text-2xl m-0 font-semibold">{{ data.name }}, {{ data.sys?.country }}</h2>
    <span class="text-sm">{{ data.dt ? (data.dt * 1000 | date:'medium') : '' }}</span>
  </div>
  <div class="flex flex-col items-center gap-0">
    <img 
      class="w-[100px] h-[100px]"
      [src]="data.weather?.[0]?.icon ? 
        'https://openweathermap.org/img/wn/' + data.weather?.[0]?.icon + '@2x.png' : ''" 
      alt="Weather icon" 
    />
    <div class="flex flex-col items-center text-center">
      <span class="text-4xl font-bold text-white">
        {{ data.main.temp }}{{ unit() === "metric" ? '°C' : '°F' }}
      </span>
      <span class="mt-2 italic text-white">{{ data.weather?.[0]?.description }}</span>
    </div>
  </div>
</div>
