<div>
  <input 
    [(ngModel)]="city"
    placeholder="Enter city name"
    (keyup.enter)="search()"
    [disabled]="loading"
  />
  <select [(ngModel)]="unit" (change)="onUnitChange()">
    <option value="metric">°C</option>
    <option value="imperial">°F</option>
  </select>
</div>
<div *ngIf="loading">Loading...</div>
<div *ngIf="error" class="error">{{ error }}</div>
