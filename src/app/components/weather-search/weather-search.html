<div class="search-container">
  <div class="input-wrapper">
    <!-- Search Input -->
    <input 
      #searchInput
      [ngModel]="city()" 
      (ngModelChange)="city.set($event)"
      placeholder="Enter city name"
      (keyup.enter)="search()"
      (focus)="onInputFocus()"
      (blur)="onInputBlur()"
    />

    <!-- Recent Searches Dropdown -->
    <div *ngIf="showRecentSearches()" class="recent-searches-dropdown">
      <div class="dropdown-header">
        <span>Recent Searches</span>
        <button 
          type="button" 
          class="clear-btn" 
          (click)="clearRecentSearches()"
          *ngIf="recentSearches().length > 0"
        >
          Clear
        </button>
      </div>
      
      <div class="dropdown-content">
        <div 
          *ngFor="let recentCity of recentSearches()" 
          class="recent-search-item"
          (click)="selectRecentSearch(recentCity)"
        >
          <i class="search-icon">🕐</i>
          {{ recentCity }}
        </div>
        
        <div *ngIf="recentSearches().length === 0" class="no-recent">
          No recent searches
        </div>
      </div>
    </div>
  </div>
  
  <!-- Unit Selector -->
  <select 
    [ngModel]="unit()" 
    (ngModelChange)="unit.set($event); onUnitChange()">
    <option value="metric">°C</option>
    <option value="imperial">°F</option>
  </select>
</div>
